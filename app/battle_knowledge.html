<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RadioSystem · 项目知识问答</title><style>body{max-width:900px;margin:45px auto;padding:0 24px;background:#ebe7da;color:#303b31;font:15px/1.8 'Microsoft YaHei',sans-serif}a{color:#526b56}h1{font-size:26px}.note{border-left:3px solid #a17f35;background:#f1eedf;padding:12px 18px;font-size:13px}textarea{box-sizing:border-box;width:100%;min-height:110px;margin:20px 0 10px;padding:14px;border:1px solid #b9bfad;border-radius:5px;font:inherit}button{padding:10px 20px;background:#485645;color:white;border:0;border-radius:4px;cursor:pointer}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:inherit;background:#f3f1e7;padding:20px}details{border-top:1px solid #bfc3b1;padding:10px}small{color:#7a7d6d}</style><a href="/">← 返回战术推演台</a><h1>项目知识问答</h1><p class="note">这里保留原有源码知识库，知识版本为初始源码快照 2026-10-22。它用于解释旧版源码；新版战术规则请以战场规则与开发说明为准。战场历史记忆由各阵营独立维护，与此知识库分开。</p><textarea id="question" placeholder="例如：RadioPacket 如何传递移动命令？"></textarea><button id="ask">检索并回答</button> <small id="status"></small><pre id="answer">输入问题后，查看本地模型回答与检索证据。</pre><div id="evidence"></div><script>const $=id=>document.getElementById(id),history=[];const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));$('ask').onclick=async()=>{$('ask').disabled=true;$('status').textContent='本地检索与模型推理中…';try{const q=$('question').value,r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({question:q,history:history.slice(-4)})}),d=await r.json();if(!r.ok)throw Error(d.detail);$('answer').textContent=d.text;$('status').textContent=d.status+' · '+d.seconds.toFixed(1)+'秒';$('evidence').innerHTML=d.evidence.map(e=>`<details><summary>${esc(e.id)} · ${esc(e.status)}</summary><pre>${esc(e.text)}</pre></details>`).join('');history.push({role:'user',content:q},{role:'assistant',content:d.text})}catch(e){$('answer').textContent=e.message;$('status').textContent='请求失败'}finally{$('ask').disabled=false}};</script></html>
