<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RadioSystem GPU 实验台</title>
<style>*{box-sizing:border-box}body{max-width:1080px;margin:36px auto;padding:0 24px;background:#f4f7fa;color:#203247;font:16px/1.7 system-ui}h1{font-size:28px;margin-bottom:4px}h2{font-size:21px;margin-top:0}h3{font-size:17px}section{background:white;padding:26px;border:1px solid #dce4eb;border-radius:14px;margin:24px 0}textarea{width:100%;padding:14px;border:1px solid #b8c8d6;border-radius:8px;font:inherit}button,select{padding:10px 16px;margin:12px 10px 0 0;border-radius:7px;border:1px solid #a8b9ca;font:inherit}button{background:#245c91;color:white;cursor:pointer}button.secondary{background:white;color:#203247}button:disabled{opacity:.6}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#f3f6f9;border-radius:8px;padding:18px;font:15px/1.8 system-ui}.muted,small{color:#67778c}details{border-top:1px solid #dce4eb;padding:10px 0;font-size:14px}.quotes{border-left:3px solid #9ab6ca;padding-left:14px;font-size:14px}.players{display:grid;grid-template-columns:1fr 1fr;gap:20px}.red{border-top:3px solid #be5760}.blue{border-top:3px solid #477cab}#scrub{width:100%;accent-color:#245c91}svg{width:100%;height:auto}@media(max-width:680px){body{padding:0 12px}.players{grid-template-columns:1fr}section{padding:18px}}</style>
<h1>RadioSystem 实验台</h1><p class="muted">私有知识问答 · GPU 本地推理 · C++ Agent 回放</p><p id="health" class="muted">正在检查本机服务</p>
<section><h2>项目资料问答</h2><p class="muted">资料版本为2026年10月22日初始源码快照。后续引擎修复与该快照分开记录。</p><textarea id="q" rows="3" aria-label="项目问题">RadioPacket 一共多少字节？</textarea><select id="mode" aria-label="检索方式"><option value="hybrid">代码感知混合检索</option><option value="dense">向量检索</option><option value="closedbook">无检索对照</option></select><button id="ask" onclick="ask()">提问</button><button class="secondary" onclick="conversation=[];document.getElementById('answer').textContent='已清空对话';">清空对话</button><p id="status" class="muted"></p><pre id="answer">等待提问</pre><div id="quotes" class="quotes"></div><div id="evidence"></div><small>摘录校验检查原文是否存在，不能自动证明答案正确。<a href="/docs">接口文档</a></small></section>
<section><h2>双 Agent 与 C++ 引擎回放</h2><p class="muted">观察者可看全局回放；Agent 只能看己方和视野内敌人。</p><button class="secondary" onclick="loadReplay()">载入实际运行记录</button><p id="replayStatus" class="muted">回放来自独立运行的C++ CourseSim，当前页面不会发出战场指令。</p><div id="replay" hidden><svg id="map" viewBox="0 0 1000 320" role="img" aria-label="五节点对抗地图"></svg><input id="scrub" type="range" min="0" max="6" value="0" aria-label="回放步骤" oninput="showStep(Number(this.value))"><p id="frameLabel"></p><div class="players"><div class="red"><h3>红方 Agent</h3><div id="redInfo"></div></div><div class="blue"><h3>蓝方 Agent</h3><div id="blueInfo"></div></div></div><p class="muted">6轮集成演示，按逻辑节拍推进，不构成胜率或实时期限评测。</p></div></section>
<script>
let conversation=[],episode=null;const $=id=>document.getElementById(id),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function health(){try{const d=await(await fetch('/health')).json();$('health').textContent=`${d.backend.model} · ${d.backend.device.toUpperCase()} · ${d.chunks} 个知识块 · ${d.model_status==='ok'?'服务就绪':'模型未就绪'}`}catch(e){$('health').textContent='本机服务暂不可用'}}health();
async function ask(){const q=$('q').value,b=$('ask');b.disabled=true;$('status').textContent='本地模型推理中…';try{const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({question:q,mode:$('mode').value,k:3,history:conversation})}),d=await r.json();if(!r.ok)throw new Error(d.detail);$('answer').textContent=d.text;const states={quote_verified:'摘录校验通过',abstained:'资料不足已拒答',rejected:'未通过校验',unverified_closedbook:'无检索回答'};$('status').textContent=`${states[d.status]||d.status} · ${d.seconds.toFixed(2)} 秒 · ${d.model}`;$('quotes').innerHTML=(d.citation_checks||[]).map(c=>`<p>${esc(c.source_id)} · ${c.valid?'原文存在':'校验失败'}<br>“${esc(c.quote)}”</p>`).join('');$('evidence').innerHTML=d.evidence.map(e=>`<details><summary>${esc(e.id)} · ${esc(e.status)}</summary><pre>${esc(e.text)}</pre></details>`).join('');conversation.push({role:'user',content:q},{role:'assistant',content:d.text});conversation=conversation.slice(-4)}catch(e){$('answer').textContent=e.message}finally{b.disabled=false}}
async function loadReplay(){try{const r=await fetch('/api/replay'),d=await r.json();if(!r.ok)throw new Error(d.detail);episode=d;$('replay').hidden=false;$('scrub').max=d.steps.length;$('scrub').value=0;$('replayStatus').textContent=`${d.model_calls} 次模型调用 · ${d.submitted_packets} 个提交数据包 · C++ 接受 ${d.engine_accepted} 个`;showStep(0)}catch(e){$('replayStatus').textContent=e.message}}
function showStep(i){if(!episode)return;const step=i?episode.steps[i-1]:null,s=step?step.after:episode.initial;let svg='<line x1="100" y1="150" x2="900" y2="150" stroke="#b7c4cf" stroke-width="3"/>';for(const n of s.nodes){const x=100+(n.id-1)*200;svg+=`<circle cx="${x}" cy="150" r="${n.id===3?30:22}" fill="${n.id===3?'#f5e6ba':'#eaf0f5'}" stroke="#7d92a5"/><text x="${x}" y="156" text-anchor="middle" fill="#203247">${n.id}</text>`}svg+='<text x="500" y="210" text-anchor="middle" fill="#8a713a">公共目标节点 3</text>';for(const u of s.entities){const x=100+(u.current_node-1)*200,y=u.side==='red'?70:258,color=u.side==='red'?'#be5760':'#477cab';svg+=`<line x1="${x}" y1="${y}" x2="${x}" y2="150" stroke="${color}" stroke-dasharray="4 4"/><circle cx="${x}" cy="${y}" r="19" fill="${color}"/><text x="${x}" y="${y+5}" fill="white" text-anchor="middle">${u.id}</text><text x="${x}" y="${y+33}" fill="${color}" text-anchor="middle" font-size="13">HP ${Number(u.hp).toFixed(1)}</text>`}$('map').innerHTML=svg;$('frameLabel').textContent=`步骤 ${i}/${episode.steps.length} · Tick ${s.tick} · 红方控制 ${s.control_ticks.red} tick / 蓝方 ${s.control_ticks.blue} tick`;for(const side of ['red','blue']){const d=step&&step.proposals.find(x=>x.side===side),obs=step&&step.observations[side];$(side+'Info').innerHTML=d?`<p><strong>${esc(d.choice)}</strong> · ${d.accepted?'校验接受':'校验拒绝'}</p><p>${esc(d.decision?.reason||d.errors.join(', '))}</p><small>当时可见实体 ${esc(obs.entities.map(u=>u.id).join(', '))} · ${d.seconds.toFixed(2)} 秒</small>`:'等待首轮决策'}}
</script></html>
